[project]
name = "nyx-backend"
version = "1.0.0"
description = "NYX analysis engine — AI-assisted serverless migration and cloud architecture advisor"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-warnings"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
